[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rt-core-amador"
version = "1.0.0"
description = "Lightweight pure-Python mathematical tools inspired by the Amador Transform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Francisco Amador Barrios Espinoza" },
]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/franciscoabarriose89-spec/Rt-core-amador"
Repository = "https://github.com/franciscoabarriose89-spec/Rt-core-amador"
Issues = "https://github.com/franciscoabarriose89-spec/Rt-core-amador/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
